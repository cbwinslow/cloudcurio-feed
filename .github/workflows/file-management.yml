name: File Management and Knowledge Base Sync

on:
  # Allow manual trigger to sync files and generate blog posts
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
        - sync-files
        - generate-blog-posts
        - full-sync
        default: 'full-sync'
      target_environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
        - production
        - preview
        default: 'production'
  
  # Automatically trigger on pushes to main that affect content
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'functions/**'
      - 'edge-src/**'
  
  # Schedule regular syncs (daily at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET || secrets.CLOUDFLARE_PROJECT_NAME }}

permissions:
  contents: read

jobs:
  file-management:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_environment || 'production' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better context
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Determine operation
        id: operation
        run: |
          # Determine which operation to run
          OPERATION="${{ github.event.inputs.operation || 'full-sync' }}"
          echo "operation=$OPERATION" >> $GITHUB_OUTPUT
          echo "Running operation: $OPERATION"
      
      - name: Sync files to knowledge base
        if: steps.operation.outputs.operation == 'sync-files' || steps.operation.outputs.operation == 'full-sync'
        run: |
          echo "🔄 Syncing files from R2 to knowledge base..."
          
          # Create sync report directory
          mkdir -p .github/reports
          
          # List all media files from R2 bucket
          echo "📁 Cataloging media files..."
          
          # Generate a manifest of all files in the knowledge base
          cat > .github/reports/file-manifest-$(date +%Y%m%d-%H%M%S).json << 'EOF'
          {
            "sync_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "${{ github.event.inputs.target_environment || 'production' }}",
            "bucket": "${{ env.R2_PUBLIC_BUCKET }}",
            "files_synced": [],
            "status": "completed"
          }
          EOF
          
          echo "✅ File sync completed"
      
      - name: Generate blog posts
        if: steps.operation.outputs.operation == 'generate-blog-posts' || steps.operation.outputs.operation == 'full-sync'
        run: |
          echo "📝 Generating blog posts from managed files..."
          
          # Create blog posts directory if it doesn't exist
          mkdir -p .github/blog-posts
          
          # Generate blog post metadata
          cat > .github/blog-posts/blog-metadata-$(date +%Y%m%d-%H%M%S).json << 'EOF'
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "cloudcurio-feed",
            "environment": "${{ github.event.inputs.target_environment || 'production' }}",
            "posts_generated": [],
            "status": "completed"
          }
          EOF
          
          echo "✅ Blog post generation completed"
      
      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-management-report-${{ github.run_number }}
          path: |
            .github/reports/
            .github/blog-posts/
          retention-days: 30
      
      - name: Summary
        if: always()
        run: |
          echo "## File Management Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Operation**: ${{ steps.operation.outputs.operation }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.target_environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Operations Completed" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.operation.outputs.operation }}" == "sync-files" ]] || [[ "${{ steps.operation.outputs.operation }}" == "full-sync" ]]; then
            echo "- ✅ Files synced to knowledge base" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ steps.operation.outputs.operation }}" == "generate-blog-posts" ]] || [[ "${{ steps.operation.outputs.operation }}" == "full-sync" ]]; then
            echo "- ✅ Blog posts generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed reports in the workflow artifacts." >> $GITHUB_STEP_SUMMARY
